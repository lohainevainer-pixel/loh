<html lang="pt-br">
     <head>

            header{

            <body>
                <header>
                 <h1>meu blog</h1>
                    <p>vou compartilhar coisas que eu aprendo na aula de programação e I.A</p>
                </header>
                <main>
                    <h2>meu primeiro post</h2>
                    <p>Boas vindas ao meu novo blog! Aqui vou compartilhar o que aprendo na aula de programação e I.A</p>
                        <button> ❤️ <span>0</span>​</button>

            <script>
                const botao = document.querySelector("button");
                botao.addEventListener("click", botaoClicado);

                function botaoClicado(){
                    console.log("fui clicado");
                    let texto = botao.querySelector("span");
                    texto.textContent++;
                }
            </script>
